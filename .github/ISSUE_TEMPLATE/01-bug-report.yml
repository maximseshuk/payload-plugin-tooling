name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'needs-triage']
assignees: []

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported already
          required: true
        - label: I have read the [documentation](https://github.com/maximseshuk/payload-plugin-tooling#readme)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Tell us what happened, what you expected, and how to reproduce the issue
      placeholder: |
        What happened:
        What you expected:
        Steps to reproduce:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Tooling Configuration
      description: Share your tooling setup (**remove API keys and sensitive data**)
      placeholder: |
        ```typescript
        import { oxlintBase } from '@seshuk/payload-plugin-tooling/oxlint'
        import { defineConfig } from 'oxlint'

        export default defineConfig(oxlintBase)
        ```
      render: typescript
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Environment Info
      description: |
        Paste output from `pnpm payload info` or list your versions.
        Please use specific version numbers instead of "latest" to help us debug faster.
      placeholder: |
        @seshuk/payload-plugin-tooling: 0.2.0
        payload: 4.0.0
        node: 24.15.0
        pnpm: 12.0.0
        plugin that uses it: @seshuk/payload-plugin-openapi 1.0.0
      render: shell
    validations:
      required: true

  - type: input
    id: code-link
    attributes:
      label: Link to reproduction code (if needed)
      description: Optional link to minimal reproduction repository
      placeholder: https://github.com/username/repo

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Error messages, stack traces, or console logs
      render: shell
