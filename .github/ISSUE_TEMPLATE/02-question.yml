name: Question / Support
description: Ask a question or get help with using the tooling
title: '[Question]: '
labels: ['question']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        **Before asking:** Please check the [documentation](https://github.com/maximseshuk/payload-plugin-tooling#readme) and [existing issues](https://github.com/maximseshuk/payload-plugin-tooling/issues).

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What do you need help with?
      placeholder: |
        Please tell us:
        - What you're trying to accomplish
        - What problem you're encountering
        - What you've tried so far
        - Any error messages you're seeing
    validations:
      required: true

  - type: textarea
    id: current-config
    attributes:
      label: Current Configuration (if relevant)
      description: Share your tooling setup (**remove API keys and sensitive data**)
      placeholder: |
        ```typescript
        import { oxlintBase } from '@seshuk/payload-plugin-tooling/oxlint'
        import { defineConfig } from 'oxlint'

        export default defineConfig(oxlintBase)
        ```
      render: typescript
