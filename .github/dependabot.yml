version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: payload
        update-types: [version-update:semver-major]
      - dependency-name: '@payloadcms/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
